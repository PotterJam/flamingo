# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "flamingo"

[setup]
script = '''
cd "$CODEX_WORKTREE_PATH/elixir"

mix deps.get
mix assets.setup
'''

[[actions]]
name = "run"
icon = "run"
command = '''
cd "$CODEX_WORKTREE_PATH/elixir"

PORT="$(
elixir -e '
cwd = File.cwd!()
base = 5000
span = 20_000
start_port = base + :erlang.phash2(cwd, span)

find_port = fn find_port, port, attempts_left ->
  if attempts_left == 0 do
    raise "Unable to find open port"
  end

  free? =
    case :gen_tcp.listen(port, [:binary, active: false, packet: 0, ip: {127,0,0,1}, reuseaddr: true]) do
      {:ok, socket} ->
        :gen_tcp.close(socket)
        true
      {:error, _} ->
        false
    end

  if free?, do: port, else: find_port.(find_port, port + 1, attempts_left - 1)
end

IO.puts(find_port.(find_port, start_port, 500))
'
)"

export PORT
export PHX_SERVER=true

mix run --no-halt
'''
